<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexora — Каталог курсів</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="container">
  
  <section class="welcome-banner mb-5 text-start">
    <div class="position-relative z-1 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
      <div class="mb-2 mb-md-0">
        <h1 class="display-5 fw-bold mb-2" style="color: var(--heading-color);">Каталог курсів</h1>
        <p class="lead text-muted mb-0 fs-5">Знайди ідеальний курс для свого рівня та цілей.</p>
      </div>
      
      <div class="search-bar shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="d-flex align-items-center">
            <i class="bi bi-search text-success me-2 fs-5"></i>
            <input type="text" id="catalogSearch" class="form-control border-0 shadow-none p-0 fs-5" placeholder="Пошук за назвою курсу">
        </div>
      </div>
    </div>
  </section>

  <section class="mb-5">
    <div class="row g-4" id="catalogCoursesContainer">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Завантаження...</span>
            </div>
        </div>
    </div>
  </section>
</main>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

<footer class="footer-custom py-4">
  <div class="container text-center">
    <h5 class="mb-3 fw-bold">Звʼяжіться з нами</h5>
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4">
      <a href="tel:+380951011590" class="contact-item"><i class="bi bi-telephone-fill"></i> +380951011590</a>
      <a href="mailto:lexoraengcourses@gmail.com" class="contact-item"><i class="bi bi-envelope-fill"></i> lexoraengcourses@gmail.com</a>
      <span class="contact-item"><i class="bi bi-geo-alt-fill"></i> м. Львів, вул. Наукова 30</span>
    </div>
    <hr class="my-3 opacity-25" style="border-color: var(--secondary-color);">
    <p class="mt-3 mb-0 small opacity-75">&copy; 2026 Lexora. Всі права захищені.</p>
  </div>
</footer>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/student-navbar-loader.js"></script>
<script src="../js/student-notifications.js"></script>
<script src="../js/student-catalog.js"></script>

</body>
</html>
