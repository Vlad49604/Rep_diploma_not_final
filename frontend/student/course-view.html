<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexora — Огляд курсу</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  
  <style>
    :root {
      --lexora-bg: #f1f8e9;
      --lexora-green: #198754;
      --heading-color: #1b5e20;
    }

    body { 
      background-color: var(--lexora-bg); 
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
        opacity: 0;
        transition: opacity 0.5s ease;
        margin-top: 90px !important;
        flex: 1 0 auto;
    }

    body.loaded main {
        opacity: 1;
    }

    /* ВУЗЬКА КАРТКА ЯК У STUDY */
    .study-content-card { 
      background: white; 
      border-radius: 24px; 
      padding: 50px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
      border: 1px solid rgba(25, 135, 84, 0.05);
    }

    /* ФІКС КНОПКИ "ЗАПИСАТИСЯ" (Зелена пігулка) */
    #sectionContent button, 
    #sectionContent .btn {
        background-color: var(--lexora-green) !important;
        color: white !important;
        border: none !important;
        border-radius: 50px !important;
        padding: 12px 45px !important;
        font-weight: 700 !important;
        box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3) !important;
        transition: 0.3s !important;
        margin-top: 20px;
    }

    #sectionContent button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(25, 135, 84, 0.4) !important;
    }

    /* СТИЛЬ КАРТИНКИ */
    #sectionContent img {
        max-width: 100% !important;
        height: auto !important;
        max-height: 450px;
        object-fit: cover;
        border-radius: 20px;
        display: block;
        margin: 0 auto 30px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* ЛОАДЕР */
    #globalLoader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: var(--lexora-bg); z-index: 10000; 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
    }

    body.loaded #globalLoader {
        display: none;
    }

    /* ПРЕВ'Ю РЕЖИМ (ФІКС ШИРИНИ) */
    .preview-mode #sidebarCol { display: none !important; }
    .preview-mode #contentCol { 
        flex: 0 0 100%; 
        max-width: 900px; /* Вужчий блок для адекватного читання */
        margin: 0 auto;
    }

    .footer-custom {
        background-color: #fff;
        border-top: 1px solid rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="preview-mode">

<div id="globalLoader">
    <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 fw-bold text-success">Lexora готує огляд...</h5>
</div>

<!-- Сюди твій JS вставить навбар -->
<div id="navbar-placeholder"></div>

<main class="container py-4">
  <div class="row justify-content-center" id="mainRow">

    <!-- ТЕХНІЧНИЙ БЛОК (для роботи JS) -->
    <div id="sidebarCol" style="display: none;">
        <h4 id="courseTitle"></h4>
        <div id="sectionsList"></div>
    </div>

    <!-- ВУЗЬКА КОЛОНКА КОНТЕНТУ -->
    <div class="col-lg-9 col-xl-8" id="contentCol">
      <div id="sectionContent" class="study-content-card">
          <div class="text-center py-5">
              <div class="spinner-border text-success"></div>
          </div>
      </div>
    </div> 

  </div>
</main>

<footer class="footer-custom py-4 text-center">
  <div class="container">
    <h5 class="mb-3 fw-bold" style="color: var(--heading-color);">Звʼяжіться з нами</h5>
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4">
      <a href="tel:+380951011590" class="contact-item"><i class="bi bi-telephone-fill text-success"></i> +380951011590</a>
      <a href="mailto:lexoraengcourses@gmail.com" class="contact-item"><i class="bi bi-envelope-fill text-success"></i> lexoraengcourses@gmail.com</a>
      <span class="contact-item"><i class="bi bi-geo-alt-fill text-success"></i> м. Львів, вул. Наукова 30</span>
    </div>
    <hr class="my-3 opacity-25" style="border-color: var(--secondary-color);">
    <p class="mt-3 mb-0 small text-muted">&copy; 2026 Lexora. Всі права захищені.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/student-navbar-loader.js"></script>
<script src="../js/student-course-view.js"></script>

</body>
</html>
