<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexora — Тестування</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
  
  <style>
      body { 
          background-color: var(--bg-color); 
          font-family: 'Plus Jakarta Sans', sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }

      /* ШИРОКИЙ ЛЕЙАУТ ЯК НА СТОРІНЦІ КУРСУ */
      main { 
          flex: 1 0 auto;
          margin-top: calc(var(--navbar-height) + 20px) !important;
          padding-bottom: 60px;
      }

      /* ХЛІБНІ КРИХТИ (Pill Style) */
      .back-nav-pill {
          background: white;
          color: var(--secondary-color);
          padding: 10px 25px;
          border-radius: 50px;
          text-decoration: none;
          font-weight: 700;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          box-shadow: 0 5px 15px rgba(0,0,0,0.05);
          transition: 0.3s;
          border: 1px solid rgba(0,0,0,0.03);
      }
      .back-nav-pill:hover { color: var(--primary-color); transform: translateX(-5px); }

      /* ГОЛОВНА КАРТКА ТЕСТУ (Широка та дихаюча) */
      #mainTaskWrapper {
          background: var(--white);
          border-radius: 30px;
          padding: 50px;
          box-shadow: 0 20px 60px rgba(27, 94, 32, 0.06);
          border: 1px solid rgba(27, 94, 32, 0.05);
          min-height: 500px;
      }

      /* СТИЛІЗАЦІЯ ВАРІАНТІВ ВІДПОВІДЕЙ */
      .option-item {
          border: 2px solid #f0f4f0 !important;
          border-radius: 18px !important;
          padding: 20px 25px !important;
          margin-bottom: 15px;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          cursor: pointer;
          background: #fcfdfc;
          font-weight: 500;
      }
      .option-item:hover {
          background-color: #f1f8e9;
          border-color: var(--primary-color) !important;
          transform: translateX(10px);
      }
      .selected-option {
          border-color: var(--primary-color) !important;
          background-color: #e8f5e9 !important;
          box-shadow: 0 8px 20px rgba(68, 191, 105, 0.15);
      }

      /* КНОПКИ (Gradient Lexora Style) */
/* КНОПКА ПЕРЕВІРКИ (Solid Lexora Green) */
.btn-check-task, .btn-success {
    background: var(--primary-color) !important; /* Тільки один колір */
    background-color: var(--primary-color) !important;
    color: white !important;
    border-radius: 50px !important;
    padding: 16px 45px !important;
    font-weight: 800 !important;
    border: none !important;
    box-shadow: 0 10px 20px rgba(68, 191, 105, 0.15) !important;
    transition: all 0.3s ease !important;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.btn-check-task:hover, .btn-success:hover {
    background-color: var(--secondary-color) !important; /* Солідний колір при наведенні */
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(68, 191, 105, 0.25) !important;
}

/* Робимо кнопки в модалці нормального розміру, а не гігантськими */
.modal-footer .btn {
    padding: 10px 25px !important; /* Менший відступ */
    font-size: 0.9rem !important;
    text-transform: none !important; /* Прибираємо капс, якщо він там є */
    letter-spacing: normal !important;
}

.btn-check-task:active {
    transform: translateY(0);
}

      /* КАРТКА ПОЯСНЕННЯ ШІ (Premium Insight) */
      .ai-insight-card {
          background: linear-gradient(165deg, #ffffff 0%, #f9fff9 100%);
          border: 1px solid rgba(68, 191, 105, 0.2);
          border-left: 5px solid var(--primary-color);
          border-radius: 20px;
          padding: 25px;
          margin-top: 25px;
          box-shadow: 0 15px 35px rgba(27, 94, 32, 0.08);
          text-align: left;
      }
      .ai-icon-circle {
          background: var(--primary-color);
          color: white;
          width: 45px; height: 45px;
          border-radius: 12px;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 12px rgba(68, 191, 105, 0.3);
          font-size: 1.4rem;
      }

      /* Лоадер */
      #globalLoader {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
          background: var(--bg-color); z-index: 9999; 
          display: flex; flex-direction: column; align-items: center; justify-content: center; 
      }

      /* КНОПКА "ЗАВЕРШИТИ ПІЗНІШЕ" */
.btn-finish-later {
    background: transparent;
    color: #819185; /* М'який сіро-зелений */
    border: 2px solid #e0e6e2;
    border-radius: 50px;
    padding: 12px 30px;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

.btn-finish-later:hover {
    background-color: #ffffff;
    color: var(--secondary-color);
    border-color: var(--primary-color);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(68, 191, 105, 0.1);
}

.btn-finish-later i {
    font-size: 1.2rem;
}
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="container-fluid px-md-5">
  <div class="row justify-content-center">
    <div class="col-xxl-8 col-xl-9 col-lg-10">
      
      <div class="mb-4 d-flex justify-content-between align-items-center">
            <a href="#" class="back-nav-pill" onclick="history.back()">
                <i class="bi bi-chevron-left"></i> 
                <span>НАЗАД ДО УРОКУ</span>
            </a>
            
      </div>

      <div class="mb-4">
          <h2 id="breadcrumbCurrent" class="fw-800 text-dark opacity-75 ms-2" style="font-size: 1.5rem;">ЗАВАНТАЖЕННЯ...</h2>
      </div>

      <div id="mainTaskWrapper" class="fade-in-up">
          </div>

      <div class="text-center mt-5">
            <button onclick="exitAndSave()" class="btn btn-finish-later shadow-none">
                <i class="bi bi-pause-circle"></i>
                <span>ЗБЕРЕГТИ ПРОГРЕС ТА ВИЙТИ</span>
            </button>
        </div>

    </div>
  </div>
</main>

<footer class="footer-custom py-4">
  <div class="container text-center">
    <h5 class="mb-3 fw-bold" style="color: var(--heading-color);">Звʼяжіться з нами</h5>
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4">
      <a href="tel:+380951011590" class="contact-item"><i class="bi bi-telephone-fill"></i> +380951011590</a>
      <a href="mailto:lexoraengcourses@gmail.com" class="contact-item"><i class="bi bi-envelope-fill"></i> lexoraengcourses@gmail.com</a>
      <span class="contact-item"><i class="bi bi-geo-alt-fill"></i> м. Львів, вул. Наукова 30</span>
    </div>
    <hr class="my-3 opacity-25" style="border-color: var(--secondary-color);">
    <p class="mt-3 mb-0 small">&copy; 2026 Lexora. Всі права захищені.</p>
  </div>
</footer>

<div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 25px; overflow: hidden;">
      
      <div class="modal-header border-0 p-4" id="modalHeaderStyle" style="background: linear-gradient(135deg, #198754, #1b5e20); color: white;">
        <h5 class="modal-title fw-800" id="contactModalLabel">
            <i class="bi"></i> Повідомлення викладачу
        </h5>
        <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4 bg-white text-start">
        <div id="modalContextInfo" class="p-3 rounded-4 mb-4 small fw-bold" style="background: #f1f8e9; color: #198754; border: 1px solid #c8e6c9;">
            Контекст: <span id="modalContextText" class="text-dark fw-bold">...</span>
        </div>

        <label class="form-label fw-bold text-muted small ms-1">Ваше запитання:</label>
        <textarea id="modalMessageText" class="form-control border-success-subtle rounded-4 p-3 shadow-none" 
                  rows="5" placeholder="Опишіть ваше запитання детально..." style="background: #fcfdfc;"></textarea>
      </div>

      <div class="modal-footer border-0 p-4 pt-0 bg-white">
        <button type="button" class="btn btn-light rounded-pill px-4 fw-bold text-muted shadow-none" data-bs-dismiss="modal">Скасувати</button>
        <button type="button" class="btn btn-success rounded-pill px-5 fw-bold shadow-sm" id="btnModalSend" onclick="submitModalMessage()">
            Відправити <i class="bi "></i>
        </button>
      </div>

    </div>
  </div>
</div>


<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

<script src="../js/student-navbar-loader.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="../js/student-notifications.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/student-tasks.js"></script>

</body>
</html>
