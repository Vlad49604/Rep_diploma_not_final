<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexora — Навчання</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
  
  <style>
      :root {
          --lexora-bg: #f1f8e9;
          --lexora-green: #198754;
      }
      
      body { 
          background-color: var(--lexora-bg);
          font-family: 'Plus Jakarta Sans', sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }

      /* ФІКС КОНТЕНТУ: щоб не було вузько */
      main { 
          flex: 1 0 auto;
          margin-top: 90px !important; /* Відступ під fixed-top навбар */
      }

      .study-content-card { 
          background: white; 
          border-radius: 24px; 
          padding: 40px; 
          box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
          border: 1px solid rgba(25, 135, 84, 0.05);
          min-height: 70vh;
      }

      /* ФІКС КАРТИНКИ: щоб не вилазила ніколи */
      #sectionContent img, .dashboard-img {
          max-width: 100% !important;
          height: auto !important;
          max-height: 450px;
          object-fit: cover;
          border-radius: 20px;
          display: block;
          margin: 0 auto 30px;
          box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }

      /* Глобальний перенос тексту (фікс довгих рядків) */
      #sectionContent {
          overflow-wrap: anywhere !important;
          word-break: normal;
      }

      /* ЛОАДЕР (без білого блимання) */
      #globalLoader {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
          background: var(--lexora-bg); z-index: 9999; 
          display: flex; flex-direction: column; align-items: center; justify-content: center; 
      }

      /* Кнопка "Назад" над карткою */
      .back-nav-link {
          color: var(--lexora-green);
          text-decoration: none;
          font-weight: 700;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 20px;
          transition: 0.2s;
      }
      .back-nav-link:hover { transform: translateX(-5px); }

      /* Кольори блоку відповіді (як ми домовлялися) */
      .student-answer-block {
          background: #f1f8e9 !important;
          color: #198754 !important;
          border: 1px solid #c8e6c9 !important;
          border-radius: 12px;
          padding: 15px;
          font-weight: 600;
      }
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div id="globalLoader">
    <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 fw-bold text-success">Lexora готує матеріали...</h5>
</div>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-11 col-xl-10">
      
      

      <div id="sectionContent" class="study-content-card">
          </div>

    </div>
  </div>
</main>

<footer class="footer-custom py-4 mt-5">
  <div class="container text-center">
    <h5 class="mb-3 fw-bold" style="color: var(--heading-color);">Звʼяжіться з нами</h5>
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4">
      <a href="tel:+380951011590" class="contact-item"><i class="bi bi-telephone-fill"></i> +380951011590</a>
      <a href="mailto:lexoraengcourses@gmail.com" class="contact-item"><i class="bi bi-envelope-fill"></i> lexoraengcourses@gmail.com</a>
      <span class="contact-item"><i class="bi bi-geo-alt-fill"></i> м. Львів, вул. Наукова 30</span>
    </div>
    <hr class="my-3 opacity-25" style="border-color: var(--secondary-color);">
    <p class="mt-3 mb-0 small">&copy; 2026 Lexora. Всі права захищені.</p>
  </div>
</footer>

<div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 25px; overflow: hidden;">
      
      <div class="modal-header border-0 p-4" id="modalHeaderStyle" style="background: linear-gradient(135deg, #198754, #1b5e20); color: white;">
        <h5 class="modal-title fw-800" id="contactModalLabel">
            <i class="bi bi-chat-left-dots-fill me-2"></i> Повідомлення
        </h5>
        <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4 bg-white">
        <div id="modalContextInfo" class="p-3 rounded-4 mb-4 small fw-bold" style="background: #f1f8e9; color: #198754; border: 1px solid #c8e6c9;">
            Контекст: <span id="modalContextText" class="text-dark">Загальне питання</span>
        </div>

        <label class="form-label fw-bold text-muted small ms-1">Ваше запитання:</label>
        <textarea id="modalMessageText" class="form-control border-success-subtle rounded-4 p-3 shadow-none" 
                  rows="5" placeholder="Опишіть ваше запитання детально..." style="background: #fcfdfc;"></textarea>
      </div>

      <div class="modal-footer border-0 p-4 pt-0 bg-white">
        <button type="button" class="btn btn-light rounded-pill px-4 fw-bold text-muted" data-bs-dismiss="modal">Скасувати</button>
        <button type="button" class="btn btn-success rounded-pill px-5 fw-bold shadow-sm" id="btnModalSend" onclick="submitModalMessage()">
            Відправити <i class="bi"></i>
        </button>
      </div>

    </div>
  </div>
</div>



<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script src="../js/student-navbar-loader.js"></script>
<script src="../js/student-notifications.js"></script>
<script src="../js/student-course-study.js"></script>

</body>
</html>
