  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

<div id="navbar-placeholder"></div>

<main class="container"> <section class="welcome-banner mb-5 text-start">
    <div class="position-relative z-1 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
      <div class="mb-4 mb-md-0">
        <h1 class="display-5 fw-bold mb-2" style="color: #1b5e20;">Мої курси</h1>
        <p class="lead text-muted mb-0 fs-5">Тут зібрані всі твої активні навчальні програми.</p>
      </div>
      <div class="search-bar" style="width: 100%; max-width: 350px;">
        <div class="d-flex align-items-center">
            <i class="bi bi-search text-success me-2 fs-5"></i>
            <input type="text" id="myCourseSearch" class="form-control border-0 shadow-none p-0 fs-5" placeholder="Що хочеш вивчити?">
        </div>
      </div>
    </div>
  </section>

  <div class="mb-5">
        <h3 class="fw-bold mb-4" style="color: #1b5e20;"><i class="bi bi-play-circle me-2"></i>Активні курси</h3>
        <div class="row g-4" id="activeCoursesContainer"></div>
  </div>

  <div class="mb-5">
        <h3 class="fw-bold mb-4" style="color: #1b5e20;"><i class="bi bi-patch-check me-2"></i>Завершені курси</h3>
        <div class="row g-4" id="completedCoursesContainer"></div>
  </div>
</main>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

<footer class="footer-custom py-4 text-center">
  <div class="container">
    <h5 class="mb-3 fw-bold" style="color: var(--heading-color);">Звʼяжіться з нами</h5>
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4">
      <a href="tel:+380951011590" class="contact-item"><i class="bi bi-telephone-fill text-success"></i> +380951011590</a>
      <a href="mailto:lexoraengcourses@gmail.com" class="contact-item"><i class="bi bi-envelope-fill text-success"></i> lexoraengcourses@gmail.com</a>
      <span class="contact-item"><i class="bi bi-geo-alt-fill text-success"></i> м. Львів, вул. Наукова 30</span>
    </div>
    <hr class="my-3 opacity-25" style="border-color: var(--secondary-color);">
    <p class="mt-3 mb-0 small text-muted">&copy; 2026 Lexora. Всі права захищені.</p>
  </div>
</footer>

<script src="../js/student-navbar-loader.js"></script>
