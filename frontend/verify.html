<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexora — Статус підтвердження</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f1f8f1; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    .status-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 400px; }
    .icon-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
    .success-icon { background-color: #e8f5e9; color: #44BF69; }
    .error-icon { background-color: #ffebee; color: #f44336; }
    .btn-lexora { background-color: #44BF69; color: white; border-radius: 10px; padding: 10px 25px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="status-card">
    <div id="statusIcon" class="icon-circle"></div>
    <h2 id="statusTitle" class="fw-bold"></h2>
    <p id="statusDesc" class="text-muted mb-4"></p>
    <a href="index.html" class="btn btn-lexora shadow-sm">На головну</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    
    const icon = document.getElementById('statusIcon');
    const title = document.getElementById('statusTitle');
    const desc = document.getElementById('statusDesc');

    if (status === 'success') {
      icon.classList.add('success-icon');
      icon.innerHTML = '<i class="bi bi-check-lg"></i>';
      title.innerText = 'Готово!';
      desc.innerText = 'Ваш email підтверджено. Тепер ви можете увійти у свій акаунт.';
    } else {
      icon.classList.add('error-icon');
      icon.innerHTML = '<i class="bi bi-x-lg"></i>';
      title.innerText = 'Упс...';
      desc.innerText = 'Токен недійсний або посилання застаріло. Спробуйте ще раз.';
    }
  </script>
</body>
</html>
