<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexora Admin — Додати контент</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
    
    <script src="../js/admin-guard.js"></script>
    
    <style>
        /* --- ГЛОБАЛЬНИЙ БРЕНДИНГ LEXORA --- */
        :root {
            --primary-color: #44BF69;
            --secondary-color: #1B5E20;
            --bg-color: #f1f8e9; /* Фірмовий фон Lexora */
        }

        body {
            background-color: var(--bg-color);
            padding-top: 20px; /* Збільшений відступ для динамічного Navbar */
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- КАРТКИ --- */
        .admin-card {
            background: #ffffff;
            border-radius: 24px; /* М'якші кути як у Lexora */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            padding: 35px;
            margin-bottom: 30px;
            border: 1px solid rgba(31, 141, 40, 0.1); /* Легка зеленувата рамка */
        }

        /* --- ТИПОГРАФІКА --- */
        h1, h2, h4 {
            color: var(--secondary-color);
            font-weight: 800; /* Жирніші заголовки */
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        /* Іконки біля заголовків */
        h1 i, h2 i, h4 i {
            background: rgba(68, 191, 105, 0.1);
            color: var(--primary-color);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
        }

        /* --- КНОПКИ --- */
        .btn-primary-custom {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 50px; /* Кнопки-пігулки */
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(68, 191, 105, 0.2);
        }

        .btn-primary-custom:hover {
            background-color: var(--secondary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(27, 94, 32, 0.2);
        }

        .btn-back {
            background: #ffffff;
            color: var(--secondary-color);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 50px;
            padding: 10px 24px;
            margin-bottom: 30px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .btn-back:hover {
            background: #f8fcf9;
            box-shadow: 0 8px 20px rgba(27, 94, 32, 0.08);
            transform: translateX(-5px);
            color: var(--primary-color);
        }

        /* --- ФОРМИ ТА ІНПУТИ --- */
        .form-label {
            font-weight: 700;
            margin-top: 15px;
            color: var(--secondary-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 14px 20px;
            border: 1.5px solid #edf2f0;
            background-color: #f8f9fa;
            font-weight: 500;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(68, 191, 105, 0.15);
        }

        .form-control[readonly] {
            background-color: #e9ecef;
            opacity: 0.7;
        }

        /* --- ЗОНА ЗАВАНТАЖЕННЯ --- */
        .upload-section {
            background: #fafdfa;
            border: 2px dashed #c2e2c9;
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            transition: 0.3s;
        }
        
        .upload-section:hover {
            border-color: var(--primary-color);
            background: #f4faf4;
        }

        .btn-dark {
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
        }

        /* Стиль для прев'ю картинки */
        #taskResult img, #sectionResult img, #result img {
            border-radius: 16px;
            margin-top: 15px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        /* --- ДОПОМІЖНІ ЕЛЕМЕНТИ --- */
        hr {
            margin: 30px 0;
            opacity: 0.1;
            border-color: var(--secondary-color);
        }

        /* Стилізація алертів видалення */
        .alert-light {
            background-color: #fff;
            border: 1px solid rgba(0,0,0,0.05) !important;
            border-radius: 16px;
        }

        /* Футер унизу екрану */
        .footer-custom {
            margin-top: auto;
            background: #ffffff;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div id="admin-navbar-placeholder"></div>

<main class="container">
    

    <div class="admin-card">
        <h1><i class="bi bi-plus-circle"></i> Додати новий вміст</h1>
        <p class="text-muted fw-medium fs-5">Виберіть тип елемента, який ви хочете створити в базі даних.</p>
        
        <select id="addTypeSelect" class="form-select form-select-lg mt-4 mb-2 shadow-sm border-success border-opacity-25 text-dark fw-bold">
            <option value="">-- Виберіть тип контенту --</option>
            <option value="course">Курс (Course)</option>
            <option value="section">Секція (Section)</option>
            <option value="task">Завдання (Task)</option>
        </select>
    </div>

    <div id="courseForm" class="admin-card" style="display: none">
        <h2><i class="bi bi-journal-plus"></i> Створити курс</h2>
        
        <label class="form-label">Назва курсу</label>
        <input type="text" id="newCourseTitle" class="form-control" placeholder="Наприклад: Англійська для початківців" />
        
        <label class="form-label">Опис курсу</label>
        <textarea id="newCourseDescription" class="form-control" rows="3" placeholder="Короткий опис..."></textarea>
        
        <label class="form-label">URL картинки (заповниться автоматично)</label>
        <input type="text" id="newCourseImage" class="form-control" placeholder="URL згенерується після завантаження" readonly />

        <div class="upload-section">
            <p class="small text-muted fw-bold mb-3">Завантажте обкладинку курсу:</p>
            <form id="uploadForm" class="d-flex flex-column flex-md-row gap-2">
                <input type="file" name="image" class="form-control" required />
                <button type="submit" class="btn btn-dark">Завантажити</button>
            </form>
            <div id="result" class="mt-3 text-center"></div>
        </div>

        <div id="deleteContainer" style="display: none;" class="alert alert-light p-3">
            <h6 class="fw-bold text-dark mb-3"><i class="bi bi-trash text-danger me-2"></i> Керування зображенням</h6>
            <div class="d-flex gap-2">
                <input type="text" id="deleteUrl" class="form-control" readonly />
                <button id="deleteBtn" class="btn btn-danger rounded-pill px-4">Видалити</button>
            </div>
            <p id="deleteMessage" class="small mt-2 mb-0"></p>
        </div>

        <button id="addCourseBtn" class="btn btn-primary-custom w-100 mt-4">Опублікувати курс</button>
    </div>

    <div id="sectionForm" class="admin-card" style="display: none">
        <h2><i class="bi bi-collection"></i> Додати секцію</h2>
        
        <label class="form-label">Виберіть батьківський курс</label>
        <select id="courseSelectSection" class="form-select text-dark fw-bold"></select>

        <label class="form-label">Назва секції</label>
        <input type="text" id="newSectionTitle" class="form-control" placeholder="Наприклад: Тема 1. Знайомство" />
        
        <label class="form-label">Опис секції</label>
        <textarea id="newSectionDescription" class="form-control" rows="2"></textarea>

        <label class="form-label">URL картинки</label>
        <input type="text" id="newSectionImage" class="form-control mb-3" readonly />

        <div class="upload-section">
            <form id="sectionUploadForm" enctype="multipart/form-data" class="d-flex flex-column flex-md-row gap-2">
                <input type="file" id="sectionFile" name="image" class="form-control" accept="image/*" required />
                <button type="submit" class="btn btn-dark">Завантажити</button>
            </form>
            <div id="sectionResult" class="mt-3 text-center"></div>
        </div>

        <div id="sectionDeleteContainer" style="display:none;" class="alert alert-light p-3">
            <div class="d-flex gap-2">
                <input type="text" id="sectionDeleteUrl" class="form-control" readonly />
                <button type="button" id="sectionDeleteBtn" class="btn btn-danger rounded-pill px-4">Видалити</button>
            </div>
            <p id="sectionDeleteMessage" class="small mt-2 mb-0"></p>
        </div>

        <button id="addSectionBtn" class="btn btn-primary-custom w-100 mt-4">Створити секцію</button>
    </div>

    <div id="taskForm" class="admin-card" style="display: none">
        <h2><i class="bi bi-pencil-square"></i> Додати завдання</h2>

        <div class="row g-3 mt-1">
            <div class="col-md-6">
                <label class="form-label mt-0">Курс</label>
                <select id="courseSelectTask" class="form-select text-dark fw-bold" required>
                    <option value="">-- Виберіть курс --</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label mt-0">Секція</label>
                <select id="sectionSelectTask" class="form-select text-dark fw-bold" required disabled>
                    <option value="">-- Спочатку курс --</option>
                </select>
            </div>
        </div>

        <label class="form-label">Назва завдання</label>
        <input type="text" id="newTaskTitle" class="form-control" />

        <label class="form-label">Опис (умова) завдання</label>
        <textarea id="newTaskDescription" class="form-control" rows="2"></textarea>

        <label class="form-label">Картинка завдання (URL)</label>
        <input type="text" id="newTaskImage" class="form-control mb-3" readonly />

        <div class="upload-section">
            <form id="taskUploadForm" enctype="multipart/form-data" class="d-flex flex-column flex-md-row gap-2">
                <input type="file" id="taskFile" name="image" class="form-control" accept="image/*" required />
                <button type="submit" class="btn btn-dark">Завантажити</button>
            </form>
            <div id="taskResult" class="mt-3 text-center"></div>
        </div>

        <div id="taskDeleteContainer" style="display:none;" class="alert alert-light p-3">
            <div class="d-flex gap-2">
                <input type="text" id="taskDeleteUrl" class="form-control" readonly />
                <button type="button" id="taskDeleteBtn" class="btn btn-danger rounded-pill px-4">Видалити</button>
            </div>
            <p id="taskDeleteMessage" class="small mt-2 mb-0"></p>
        </div>

        <label class="form-label text-success mt-4">Тип механіки завдання</label>
        <select id="taskType" class="form-select mb-4 border-success border-opacity-50 text-dark fw-bold">
          <option value="multiple">Вибір відповіді</option>
          <option value="essay">Розгорнута відповідь</option>
          <option value="gap">Пропущене слово</option>
          <option value="matching">Відповідність</option>
        </select>

        <div id="taskExtraFields" class="p-4 bg-light rounded-4 border border-success border-opacity-10 mb-4">
            </div>

        <button id="addTaskBtn" class="btn btn-primary-custom w-100 mt-2">Опублікувати завдання</button>
    </div>
</main>

<footer class="footer-custom">
    <div class="container text-center">
        <p class="mb-0 fw-bold opacity-75 text-muted">&copy; 2026 Lexora Admin. Всі права захищені.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="http://localhost:5002/socket.io/socket.io.js"></script>
<script src="../js/admin-navbar-loader.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/adminCoursesAdd.js"></script>
<script src="../js/adminSectionsAdd.js"></script>
<script src="../js/adminTasksAdd.js"></script>
</body>
</html>
