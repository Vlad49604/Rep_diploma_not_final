<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexora Admin — Модерація курсу</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/admin-guard.js"></script>
    
    <style>
        /* --- ГЛОБАЛЬНИЙ БРЕНДИНГ LEXORA --- */
        :root {
            --primary-color: #44BF69;
            --secondary-color: #1B5E20;
            --bg-color: #f1f8e9;
            --footer-bg: #d6efd6;
        }

        body {
            background-color: var(--bg-color) !important;
            padding-top: 30px; /* Відступ під Navbar */
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        main { flex: 1 0 auto; padding-bottom: 60px; }

        /* --- КАРТКИ --- */
        .view-card {
            background: #ffffff !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04) !important;
            padding: 35px !important;
            margin-bottom: 25px;
            border: 1px solid rgba(31, 141, 40, 0.1) !important;
        }

        h1, h2, h3 { color: var(--secondary-color); font-weight: 800; letter-spacing: -0.5px; }

        /* --- СТАТИСТИКА КУРСУ (БЕЗ ЧЕРВОНОГО/СИНЬОГО) --- */
        #adminPriceBadge {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .stat-card {
            background: #fafdfa;
            border: 1px solid #edf2f0;
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            flex: 1;
            min-width: 220px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(68, 191, 105, 0.08);
            border-color: #c2e2c9;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(68, 191, 105, 0.1);
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .stat-icon.dark {
            background: rgba(27, 94, 32, 0.08);
            color: var(--secondary-color);
        }

        /* --- АККОРДЕОН СЕКЦІЙ --- */
        .custom-accordion .accordion-item {
            border: 1px solid rgba(0,0,0,0.05) !important;
            border-radius: 16px !important; 
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            overflow: hidden;
        }
        
        .custom-accordion .accordion-button { 
            border-radius: 16px !important; 
            font-size: 1.15rem; 
            padding: 1.25rem 1.5rem;
            transition: all 0.3s;
        }
        
        .custom-accordion .accordion-button:not(.collapsed) {
            background-color: #f1f8e9 !important; 
            color: var(--secondary-color) !important; 
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.05);
        }

        .custom-accordion .accordion-body {
            background-color: #ffffff;
            padding: 2rem 1.5rem;
        }

        /* --- АККОРДЕОН ЗАВДАНЬ --- */
        .task-accordion .accordion-item {
            border: 1px solid #edf2f0 !important;
            border-radius: 12px !important;
            margin-bottom: 1rem;
            overflow: hidden;
            box-shadow: none;
        }

        .task-accordion .accordion-button {
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            background-color: #f8fcf9;
        }

        .task-accordion .accordion-button:not(.collapsed) {
            background-color: #fff !important;
        }

        .task-accordion .accordion-body {
            background-color: #fff;
            border-top: 1px solid #edf2f0;
            padding: 1.5rem;
        }

        /* --- ДРІБНІ ДЕТАЛІ --- */
        .task-icon-circle {
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; flex-shrink: 0; width: 42px; height: 42px;
            background: rgba(68, 191, 105, 0.1); color: var(--primary-color);
        }

        #courseBannerContainer img {
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .btn-close-view {
            background: #fff;
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--secondary-color);
            font-weight: 700;
            padding: 10px 25px;
            border-radius: 50px;
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .btn-close-view:hover { 
            background: #fffafa; 
            color: #dc3545;
            transform: translateX(-3px); 
            box-shadow: 0 5px 15px rgba(220,53,69,0.1); 
            border-color: #fee2e2;
        }

        /* --- ФУТЕР --- */
        .footer-custom {
            background-color: var(--footer-bg) !important; 
            padding: 25px 0; 
            margin-top: auto; 
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div id="admin-navbar-placeholder"></div>

<main class="container">
    <div class="view-card">
        <div class="mb-4">
            <h1 class="fw-bolder mb-2" id="displayCourseTitle" style="font-size: 2.4rem; color: var(--secondary-color);">Завантаження...</h1>
            
            <div id="adminPriceBadge" class="mt-4">
                <div class="d-flex flex-wrap gap-3">
                    <div class="stat-card">
                        <div class="stat-icon dark"><i class="bi bi-person-badge"></i></div>
                        <div>
                            <small class="text-muted d-block fw-bold" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Автор курсу</small>
                            <span id="adminDisplayAuthor" class="fw-bold fs-6 text-dark mt-1 d-block">Завантаження...</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="bi bi-tag-fill"></i></div>
                        <div>
                            <small class="text-muted d-block fw-bold" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Ціна студента</small>
                            <span id="adminDisplayPrice" class="fw-bolder fs-5 text-dark mt-1 d-block">0 ₴</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon dark"><i class="bi bi-pie-chart-fill"></i></div>
                        <div>
                            <small class="text-muted d-block fw-bold" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Дохід Lexora</small>
                            <span id="adminDisplayFee" class="fw-bolder fs-5 text-dark mt-1 d-block">0 ₴</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="bi bi-wallet2"></i></div>
                        <div>
                            <small class="text-muted d-block fw-bold" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Частка вчителя</small>
                            <span id="adminDisplayTeacher" class="fw-bolder fs-5 text-dark mt-1 d-block">0 ₴</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="courseBannerContainer" class="mb-4 d-flex align-items-center justify-content-center" style="display: none; height: 300px; background: transparent; overflow: hidden;">
            <img id="displayCourseImage" src="" style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div class="text-dark fs-5 bg-light p-4 rounded-4 border" style="line-height: 1.6; white-space: pre-wrap;" id="displayCourseDesc">
            Опис завантажується...
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 mt-5">
        <h3 class="fw-bold m-0" style="color: var(--secondary-color);">
            <i class="bi bi-layers-half me-2"></i>Структура курсу
        </h3>
    </div>

    <div id="sectionsAccordion" class="accordion custom-accordion">
        <div class="text-center p-5"><div class="spinner-border text-success"></div></div>
    </div>
</main>

<footer class="footer-custom">
  <div class="container text-center">
    <p class="mb-0 fw-bold opacity-75">&copy; 2026 Lexora Admin. Всі права захищені.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="http://localhost:5002/socket.io/socket.io.js"></script>
<script src="../js/admin-navbar-loader.js"></script>
<script src="../js/admin-notifications.js"></script>
<script src="../js/admin-view.js"></script>

</body>
</html>
