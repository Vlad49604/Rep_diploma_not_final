<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування контенту — Lexora Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/admin-guard.js"></script>
    
    <style>
        /* --- ГЛОБАЛЬНИЙ БРЕНДИНГ LEXORA --- */
        :root {
            --primary-color: #44BF69;
            --secondary-color: #1B5E20;
            --bg-color: #f1f8e9;
        }

        body {
            background-color: var(--bg-color);
            padding-top: 30px; /* СУВОРО 30 ПІКСЕЛІВ ЯК ТИ ПРОСИВ */
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main { flex: 1 0 auto; padding-bottom: 60px; }

        /* --- КАРТКИ (БЕЗ ЛІНІЙ ТА ТРАНСФОРМАЦІЙ) --- */
        .admin-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            padding: 35px;
            margin-bottom: 25px;
            border: 1px solid rgba(31, 141, 40, 0.1);
        }

        /* ПРИБРАВ ЛІНІЮ ЗЛІВА */
        .type-selector-card { border-left: none; }

        h1, h2, h3 { color: var(--secondary-color); font-weight: 800; letter-spacing: -0.5px; }

        .btn-primary-custom {
            background-color: var(--primary-color);
            color: white; border: none; padding: 14px 25px;
            border-radius: 50px; font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(68, 191, 105, 0.2);
        }
        .btn-primary-custom:hover { background-color: var(--secondary-color); color: white; transform: translateY(-2px); }

        .form-label { font-weight: 700; margin-top: 15px; color: var(--secondary-color); font-size: 0.85rem; text-transform: uppercase; opacity: 0.7; }
        
        .form-control, .form-select {
            border-radius: 12px; padding: 12px 18px; border: 1.5px solid #edf2f0;
            background-color: #f8f9fa; font-weight: 500; transition: 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color); background-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(68, 191, 105, 0.15);
        }

        .preview-img {
            display: block; margin: 15px 0; max-width: 280px;
            border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 4px solid white;
        }

        .upload-zone {
            background: #fafdfa; border: 2px dashed #c2e2c9;
            border-radius: 16px; padding: 20px; margin: 15px 0;
        }

        .icon-box {
            width: 48px; height: 48px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(68, 191, 105, 0.1); color: var(--primary-color);
            margin-right: 15px; font-size: 1.3rem;
        }

        /* 🔥 ІДЕНТИЧНИЙ ФУТЕР З ДАШБОРДУ */
        .footer-custom {
            padding: 1.5rem 0;
            margin-top: auto;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div id="admin-navbar-placeholder"></div>

<main class="container">
    <div class="admin-card">
        <h1 class="mb-4"><div class="icon-box"><i class="bi bi-pencil-square"></i></div>Параметри редагування</h1>
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Який тип?</label>
                <select id="editTypeSelect" class="form-select fw-bold">
                    <option value="">Оберіть тип</option>
                    <option value="course">Курс</option>
                    <option value="section">Секція</option>
                    <option value="task">Завдання</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Курс</label>
                <select id="editCourseSelect" class="form-select fw-bold" style="display:none"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Секція</label>
                <select id="editSectionSelect" class="form-select fw-bold" style="display:none"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Завдання</label>
                <select id="editTaskSelect" class="form-select fw-bold" style="display:none"></select>
            </div>
        </div>
    </div>

    <div id="courseEditForm" class="admin-card" style="display:none">
        <h2 class="mb-4"><div class="icon-box"><i class="bi bi-journal-check"></i></div>Налаштування курсу</h2>
        <label class="form-label">Назва курсу</label>
        <input type="text" id="editTitle" class="form-control" placeholder="Нова назва">
        <label class="form-label">Опис курсу</label>
        <textarea id="editDescription" class="form-control" rows="4" placeholder="Новий опис"></textarea>
        <label class="form-label">URL зображення</label>
        <input type="text" id="editImageUrl" class="form-control mb-2" readonly>
        <img id="courseImagePreview" class="preview-img" src="" alt="Прев'ю">
        <div class="upload-zone" id="courseUploadZone">
            <form id="uploadForm" class="d-flex flex-column flex-md-row gap-2" enctype="multipart/form-data">
                <input type="file" id="imageFile" class="form-control" accept="image/*">
                <button type="submit" class="btn btn-dark rounded-pill px-4">Завантажити</button>
            </form>
        </div>
        <div class="d-flex gap-3 mt-4">
            <button id="editBtn" class="btn btn-primary-custom flex-grow-1 shadow-sm">Оновити дані курсу</button>
            <button id="deleteImageBtn" class="btn btn-outline-danger rounded-pill px-4">Видалити фото</button>
        </div>
    </div>

    <div id="sectionEditForm" class="admin-card" style="display:none">
        <h2 class="mb-4"><div class="icon-box"><i class="bi bi-collection"></i></div>Налаштування секції</h2>
        <label class="form-label">Назва секції</label>
        <input type="text" id="editSectionTitle" class="form-control">
        <label class="form-label">Опис секції</label>
        <textarea id="editSectionDescription" class="form-control" rows="3"></textarea>
        <label class="form-label">URL зображення секції</label>
        <input type="text" id="editSectionImageUrl" class="form-control mb-2" readonly>
        <img id="sectionImagePreview" class="preview-img" src="" alt="Прев'ю секції">
        <div class="upload-zone" id="sectionUploadZone">
            <form id="sectionUploadForm" class="d-flex flex-column flex-md-row gap-2" enctype="multipart/form-data">
                <input type="file" id="sectionFile" class="form-control" accept="image/*">
                <button type="submit" class="btn btn-dark rounded-pill px-4">Завантажити</button>
            </form>
        </div>
        <div class="d-flex gap-3 mt-4">
            <button id="editSectionBtn" class="btn btn-primary-custom flex-grow-1 shadow-sm">Оновити секцію</button>
            <button id="sectionDeleteBtn" class="btn btn-outline-danger rounded-pill px-4">Видалити фото</button>
        </div>
    </div>

    <div id="taskEditBlock" class="admin-card" style="display:none;">
        <h3 class="mb-4"><div class="icon-box"><i class="bi bi-controller"></i></div>Редагувати Завдання</h3>
        <hr>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Тип механіки</label>
                <select id="taskType" class="form-select border-success border-opacity-25 fw-bold">
                    <option value="multiple">Multiple choice (Вибір)</option>
                    <option value="essay">Writing (Есе)</option>
                    <option value="gap">Gap Fill (Пропуски)</option>
                    <option value="matching">Matching (Пари)</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Назва завдання</label>
                <input type="text" id="taskTitle" class="form-control fw-bold">
            </div>
        </div>
        <label class="form-label">Умова завдання</label>
        <textarea id="taskDescription" class="form-control mb-3" rows="2"></textarea>
        <label class="form-label">Зображення завдання</label>
        <input type="text" id="taskImageUrl" class="form-control mb-2" readonly>
        <img id="taskImagePreview" class="preview-img" src="">
        <div class="upload-zone">
            <form id="taskUploadForm" class="d-flex flex-column flex-md-row gap-2" enctype="multipart/form-data">
                <input type="file" id="taskFile" class="form-control" accept="image/*">
                <button type="submit" class="btn btn-dark rounded-pill px-4">Змінити фото</button>
            </form>
            <div id="taskDeleteContainer" class="mt-3" style="display:none;">
                <button type="button" id="taskDeleteBtn" class="btn btn-sm btn-link text-danger fw-bold text-decoration-none">
                    <i class="bi bi-x-circle me-1"></i> Видалити поточну картинку
                </button>
                <span id="taskDeleteMessage" class="small text-muted ms-2"></span>
            </div>
        </div>
        <div id="taskExtraFields" class="p-4 bg-light rounded-4 border border-success border-opacity-10 mb-4"></div>
        <button id="updateTaskBtn" class="btn btn-primary-custom w-100 shadow-sm py-3 fs-5">Зберегти всі зміни завдання</button>
    </div>
</main>

<footer class="footer-custom py-4">
  <div class="container text-center">
    <p class="mb-0 fw-bold opacity-75 text-dark">&copy; 2026 Lexora Admin. Всі права захищені.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="http://localhost:5002/socket.io/socket.io.js"></script>
<script src="../js/admin-navbar-loader.js"></script>
<script src="../js/admin-notifications.js"></script>
<script src="../js/admin-edit.js"></script>

</body>
</html>
