<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexora Admin — База користувачів</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">

    <style>
        body { 
            background-color: #f1f8e9 !important; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* --- ФІКС СИНЬОГО ТА ФОКУСУ --- */
        *:focus { outline: none !important; }
        .form-control:focus, .btn:focus {
            border-color: #44BF69 !important;
            box-shadow: 0 0 0 0.25rem rgba(68, 191, 105, 0.2) !important;
        }
        .table-hover > tbody > tr:hover > td {
            background-color: rgba(68, 191, 105, 0.05) !important;
        }

        /* --- ТАБЛИЦЯ ТА СКРОЛІНГ --- */
        .table-wrapper-card {
            background: #ffffff !important;
            border-radius: 24px !important;
            border: 1px solid rgba(31, 141, 40, 0.1) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04) !important;
            overflow: hidden;
            height: auto !important; /* Вбиваємо нескінченну висоту */
        }
        
        .table-scroll-container {
            max-height: 700px; /* Ліміт висоти для скролінгу */
            overflow-y: auto;
        }
        
        .table-custom th {
            position: sticky; 
            top: 0;
            z-index: 10;
            color: #1b5e20;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            background-color: #f8fcf9 !important;
            border-bottom: 2px solid rgba(68, 191, 105, 0.2) !important;
            padding: 18px 15px;
        }

        .table-custom td {
            padding: 15px;
            font-weight: 600;
            border-bottom: 1px solid rgba(27, 94, 32, 0.05);
        }

        /* --- ПОШУК ПІГУЛКА --- */
        .search-wrapper {
            background: #fff;
            border: 1.5px solid rgba(27, 94, 32, 0.1);
            transition: all 0.3s;
        }
        .search-wrapper:focus-within {
            border-color: #44BF69;
            box-shadow: 0 0 0 0.25rem rgba(68, 191, 105, 0.15);
        }

        h2.fw-800 { font-weight: 800 !important; letter-spacing: -0.5px; color: #1b5e20; }
        
        /* Спеціальний стиль для ролей */
        .role-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div id="admin-navbar-placeholder"></div>

<main class="container flex-grow-1" style="margin-top: 130px; padding-bottom: 60px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2">
        <h2 class="fw-800 mb-0 d-flex align-items-center">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 50px; height: 50px;">
                <i class="bi bi-people-fill fs-4"></i>
            </div>
            База користувачів
        </h2>
    </div>

    <div class="search-wrapper rounded-pill p-2 mb-4 d-flex flex-row align-items-center shadow-sm">
        <i class="bi bi-search text-success ms-3 me-2 fs-4"></i>
        <input type="text" id="searchUser" class="form-control border-0 shadow-none fs-6 fw-semibold py-2 bg-transparent" placeholder="Знайти користувача за ім'ям або email..." onkeyup="filterUsers()">
    </div>

    <div class="table-wrapper-card p-0 mb-5">
        <div class="table-scroll-container">
            <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-4">Користувач</th>
                        <th>Роль</th>
                        <th>Статус</th>
                        <th>Дата реєстрації</th>
                        <th class="text-end pe-4">Дія</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="5" class="text-center p-5"><div class="spinner-border text-success"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="footer-custom py-4 mt-auto w-100">
  <div class="container text-center">
    <p class="mb-0 fw-bold opacity-75 text-muted">&copy; 2026 Lexora Admin. Всі права захищені.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="http://localhost:5002/socket.io/socket.io.js"></script>
<script src="../js/admin-navbar-loader.js"></script>
<script src="../js/admin-notifications.js"></script>
<script src="../js/admin-users.js"></script>
</body>
</html>
